<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bloom</title>
<meta name="description" content="Daily habits, weekly and monthly goals, workouts and water, all in one place.">
<meta name="theme-color" content="#fbf2ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#231a17" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bloom">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div>
      <p class="eyebrow" id="today-label"></p>
      <h1 id="page-title">Today</h1>
    </div>
    <button class="avatar" id="profile-btn" data-click="profile" aria-label="Your profile"></button>
  </header>

  <main id="view"></main>

  <nav class="tabs" aria-label="Sections">
    <div class="tabs-inner">
      <button class="tab" data-tab="today">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        Today
      </button>
      <button class="tab" data-tab="goals">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>
        Goals
      </button>
      <button class="tab" data-tab="workouts">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>
        Workouts
      </button>
      <button class="tab" data-tab="money">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7.5V17a2.5 2.5 0 0 0 2.5 2.5h13V9.5h-15A1.5 1.5 0 0 1 4 8V7.5A2.5 2.5 0 0 1 6.5 5H17v4.5"/><circle cx="15.5" cy="14.5" r="1" fill="currentColor"/></svg>
        Money
      </button>
      <button class="tab" data-tab="seeds">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21v-8.5"/><path d="M12 12.5C12 8.5 9 5.5 4 5.5c0 4 3 7 8 7z"/><path d="M12 10.5c0-3.5 2.5-6 7-6 0 3.5-2.5 6-7 6z"/><path d="M7 21h10"/></svg>
        Seeds
      </button>
    </div>
  </nav>

  <script src="affirmations.js"></script>
  <script src="app.js"></script>
</body>
</html>
